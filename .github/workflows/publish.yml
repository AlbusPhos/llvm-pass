name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag and version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          echo "tag=$TAG cargo=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag v$TAG != Cargo.toml version $VER"
            exit 1
          fi

  test:
    name: Test (LLVM 22)
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM 22
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget lsb-release software-properties-common gnupg
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y llvm-22-dev clang-22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-test-llvm22

      - name: Configure LLVM environment
        run: |
          echo "LLVM_CONFIG_PATH=/usr/bin/llvm-config-22" >> "$GITHUB_ENV"
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: test
        run: cargo test --locked

  publish-crates:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM 22
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget lsb-release software-properties-common gnupg
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y llvm-22-dev clang-22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-crates-llvm22

      - name: Configure LLVM environment
        run: |
          echo "LLVM_CONFIG_PATH=/usr/bin/llvm-config-22" >> "$GITHUB_ENV"
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Dry run
        run: cargo publish --locked --dry-run

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  create-release:
    name: Create GitHub Release
    needs: publish-crates
    runs-on: ubuntu-24.04
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
