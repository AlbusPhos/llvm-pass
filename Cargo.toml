[package]
name = "llvm-pass"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["AlbusPhos <owo.zzz@proton.me>"]
description = "A framework for writing LLVM pass plugins in Rust via cxx FFI (LLVM 18-22)"
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/AlbusPhos/llvm-pass"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["llvm22"]
llvm18 = ["inkwell?/llvm18-1-no-llvm-linking"]
llvm19 = ["inkwell?/llvm19-1-no-llvm-linking"]
llvm20 = ["inkwell?/llvm20-1-no-llvm-linking"]
llvm21 = ["inkwell?/llvm21-1-no-llvm-linking"]
llvm22 = ["inkwell?/llvm22-1-no-llvm-linking"]
inkwell = ["dep:inkwell"]

[dependencies]
cxx = "1.0"
inkwell = { version = "0.11.0", optional = true, default-features = false, features = ["target-all", "no-libffi-linking"] }

[build-dependencies]
cxx-build = "1.0"

[package.metadata.docs.rs]
no-default-features = true
features = ["llvm21", "inkwell"]